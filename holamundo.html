<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hola Mundo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:'Poppins',sans-serif;

    background: linear-gradient(
        135deg,
        #3f4f24,
        #556b2f,
        #728c3a,
        #2f3e1c
    );
    background-size:400% 400%;
    animation:fondo 15s ease infinite;
}

@keyframes fondo{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.tarjeta{
    width:100%;
    max-width:600px;
    text-align:center;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.18);
    border-radius:30px;

    padding:60px 40px;

    box-shadow:
        0 20px 40px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.2);

    animation:entrada .8s ease;
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.emoji{
    font-size:80px;
    display:inline-block;
    animation:saludar 2s infinite;
}

@keyframes saludar{
    0%,100%{transform:rotate(0deg);}
    25%{transform:rotate(15deg);}
    50%{transform:rotate(-8deg);}
    75%{transform:rotate(10deg);}
}

h1{
    margin-top:15px;
    font-size:clamp(2.5rem,7vw,4.5rem);
    font-weight:900;

    background:linear-gradient(
        90deg,
        #f4f1de,
        #d8f3dc,
        #b7e4c7
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

p{
    margin-top:15px;
    font-size:1.1rem;
    color:rgba(255,255,255,.9);
    line-height:1.6;
}

.boton{
    margin-top:30px;
    border:none;
    border-radius:50px;
    padding:14px 34px;

    font-size:1rem;
    font-weight:700;
    cursor:pointer;

    color:white;
    background:linear-gradient(
        135deg,
        #6b8e23,
        #8da844
    );

    box-shadow:0 8px 20px rgba(107,142,35,.4);

    transition:.3s;
}

.boton:hover{
    transform:translateY(-4px) scale(1.05);
    box-shadow:0 12px 25px rgba(107,142,35,.6);
}

footer{
    margin-top:35px;
    color:rgba(255,255,255,.75);
    font-size:.9rem;
    letter-spacing:1px;
}

.barra{
    width:80px;
    height:5px;
    margin:20px auto;
    border-radius:999px;
    background:#d8f3dc;
}
</style>
</head>

<body>

<main class="tarjeta">

    <span class="emoji">🌿</span>

    <h1>¡Hola Mundo!</h1>

    <div class="barra"></div>

    <p>
        Mi primera página web con HTML y CSS.
        Diseño moderno inspirado en tonos verde olivo.
    </p>

    <button class="boton"
        onclick="this.textContent='¡Bienvenido a AppOServices! 🌿'">
        Saludar
    </button>

    <footer>
        Elias • UTP • AppOServices
    </footer>

</main>

</body>
</html>
