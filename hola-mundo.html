<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e1b4b, #4c1d95, #0f766e);
      background-size: 300% 300%;
      animation: fondo 12s ease infinite;
      color: #fff;
    }

    @keyframes fondo {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .tarjeta {
      max-width: 560px;
      width: 100%;
      text-align: center;
      padding: 56px 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      animation: aparecer 0.9s ease-out;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    .emoji {
      font-size: 64px;
      display: inline-block;
      animation: saludar 2s ease-in-out infinite;
      transform-origin: 70% 70%;
    }

    @keyframes saludar {
      0%, 60%, 100% { transform: rotate(0); }
      10%, 30% { transform: rotate(16deg); }
      20%, 40% { transform: rotate(-8deg); }
    }

    h1 {
      margin-top: 12px;
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 800;
      background: linear-gradient(90deg, #a5f3fc, #f0abfc, #fde68a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin-top: 12px;
      font-weight: 300;
      font-size: 1.05rem;
      opacity: 0.85;
    }

    .boton {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 28px;
      border-radius: 999px;
      border: none;
      font: 600 1rem 'Poppins', sans-serif;
      color: #1e1b4b;
      background: #fff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .boton:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.3);
    }

    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <span class="emoji">👋</span>
    <h1>¡Hola Mundo!</h1>
    <p>Mi primera página web con HTML y CSS.</p>
    <button class="boton" onclick="this.textContent = '¡Bienvenido! 🎉'">Saludar</button>
    <footer>Elias · UTP · AppOServices</footer>
  </main>
</body>
</html>
